<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Où seront Ulysse et Indiana?</title>
<meta name="description" content="Marathon de Québec, dimanche 4 octobre 2026 : où Ulysse et Indiana seront à chaque heure, selon leur plan de course.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha256-qx5w1Z7EBGW65+cDDaLzzPKBM/1QLmK9WY7vut/XpzI=" crossorigin="">
<style>
:root {
  --ink: #1f1a2c;
  --muted: #5c566c;
  --paper: #ffffff;
  --ground: #ecebe7;
  --line: #e1dee7;
  --rail: #d9d5e0;
  --u: #5b2d97;
  --i: #e05a12;
  --i-ink: #ad430a;
  --zone: #ffc62b;
  --zone-ink: #5a4100;
  --velo: #0d7a64;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 17px/1.35 var(--font);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--u); outline-offset: 2px; }

/* ---------- layout: laptop ---------- */
.app {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr auto;
  grid-template-areas: "stage" "scrub";
}
.stage { grid-area: stage; position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: #ffffff; }

.panel {
  position: absolute;
  z-index: 1000;
  top: 16px;
  left: 16px;
  width: 340px;
  background: var(--paper);
  border-radius: 16px;
  box-shadow: 0 1px 2px rgb(31 26 44 / 0.12), 0 8px 28px rgb(31 26 44 / 0.16);
  padding: 16px 18px 14px;
  display: grid;
  gap: 8px;
}
.eyebrow {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.top { display: flex; flex-direction: column-reverse; gap: 6px; }
.clock {
  margin: 0 0 2px;
  font: 700 46px/1 var(--mono);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.runners { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.runner {
  display: grid;
  grid-template-columns: 14px auto 1fr;
  align-items: baseline;
  column-gap: 8px;
}
.runner .dot { width: 14px; height: 14px; border-radius: 50%; align-self: center; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.15); }
.runner.u .dot { background: var(--u); }
.runner.i .dot { background: var(--i); }
.runner .who { font-weight: 700; }
.runner .who small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 4px; }
.runner .st { justify-self: end; text-align: right; font-variant-numeric: tabular-nums; }
.runner.u .st { color: var(--u); font-weight: 700; }
.runner.i .st { color: var(--i-ink); font-weight: 700; }
.slot { height: 42px; display: flex; align-items: center; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.banner {
  margin: 0;
  width: 100%;
  background: var(--zone);
  color: var(--zone-ink);
  font-weight: 700;
  font-size: 15px;
  border-radius: 10px;
  padding: 8px 10px;
}
.tip { margin: 0; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

/* layer toggles */
.toggles {
  position: absolute;
  z-index: 1000;
  top: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.tgl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: 0 2px 10px rgb(31 26 44 / 0.14);
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}
.tgl svg { width: 22px; height: 22px; flex: none; }
.tgl .box {
  width: 20px; height: 20px; border-radius: 6px;
  border: 2px solid #a9a3b6; background: #fff;
  display: grid; place-items: center;
  flex: none;
}
.tgl .box svg { width: 14px; height: 14px; opacity: 0; }
.tgl[aria-pressed="true"] .box { border-color: var(--ink); background: var(--ink); }
.tgl[aria-pressed="true"] .box svg { opacity: 1; }
#tgl-velo svg.ico { color: var(--velo); }
.velo-note {
  margin: 0;
  background: var(--paper);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 14px;
  font-weight: 700;
  color: var(--velo);
  box-shadow: 0 2px 10px rgb(31 26 44 / 0.14);
}

/* ---------- time scrubber ---------- */
.scrubber {
  grid-area: scrub;
  position: relative;
  z-index: 1001;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding: 8px 40px calc(10px + env(safe-area-inset-bottom, 0px));
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}
.evrow { position: relative; height: 30px; }
.evl {
  position: absolute;
  top: 3px;
  left: calc(var(--p) * 100%);
  transform: translateX(-11px);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 25px;
  padding: 0 10px 0 5px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}
.evl:hover { background: #f3f1f6; }
.evl .d { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.2); }
.evl.u .d { background: var(--u); }
.evl.i .d { background: var(--i); }
.evl b { font-weight: 700; }
.evl.u b { color: var(--u); }
.evl.i b { color: var(--i-ink); }
.evl.zone { background: var(--zone); color: var(--zone-ink); }
.evl.zone b { color: var(--zone-ink); }
.evl.end { transform: translateX(calc(-100% + 11px)); flex-direction: row-reverse; padding: 0 5px 0 10px; }
@media (max-width: 1099px) { .evl .nm { display: none; } }

.rail { position: relative; height: 46px; outline: none; }
.rail:focus-visible { outline: 3px solid var(--u); outline-offset: 4px; border-radius: 8px; }
.groove, .fill, .band { position: absolute; left: 0; right: 0; top: 12px; height: 8px; border-radius: 4px; }
.groove { background: var(--rail); }
.fill { right: auto; width: calc(var(--p) * 100%); background: #8f87a3; }
.band { right: auto; left: calc(var(--a) * 100%); width: calc((var(--b) - var(--a)) * 100%); top: 9px; height: 14px; border-radius: 4px; background: var(--zone); box-shadow: 0 0 0 1px rgb(90 65 0 / 0.25); min-width: 6px; }
.tick { position: absolute; left: calc(var(--p) * 100%); top: 24px; width: 2px; height: 6px; margin-left: -1px; background: #b5afc0; }
.tick span { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tick.minor { height: 4px; background: #cdc8d5; }
.ev {
  position: absolute; left: calc(var(--p) * 100%); top: 16px;
  width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.2);
  pointer-events: none;
}
.ev.u { background: var(--u); }
.ev.i { background: var(--i); }
.thumb {
  position: absolute; left: calc(var(--p) * 100%); top: 16px;
  width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
  background: var(--ink); border: 4px solid #fff;
  box-shadow: 0 0 0 1px rgb(31 26 44 / 0.35), 0 3px 10px rgb(31 26 44 / 0.35);
  pointer-events: none;
}

/* ---------- map marks ---------- */
.leaflet-container { font-family: var(--font); }
/* Fallback raster tiles: muted so the two routes stand out. */
.raster-muted .leaflet-tile-pane { filter: saturate(0.4) contrast(0.92) brightness(1.04); }
.runner-icon { position: relative; }
.runner-icon .rdot {
  position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%;
  border: 4px solid #fff; box-shadow: 0 1px 6px rgb(0 0 0 / 0.45);
}
.runner-icon .rlabel {
  position: absolute; top: -14px; height: 28px; line-height: 28px; padding: 0 11px;
  border-radius: 999px; color: #fff; font-weight: 700; font-size: 16px; white-space: nowrap;
  box-shadow: 0 1px 6px rgb(0 0 0 / 0.35);
}
.runner-icon.u .rdot, .runner-icon.u .rlabel { background: var(--u); }
.runner-icon.i .rdot, .runner-icon.i .rlabel { background: var(--i); }
.runner-icon.u .rlabel { left: 17px; }
.runner-icon.i .rlabel { right: 17px; }

.km-icon span {
  display: grid; place-items: center;
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.35);
  color: #fff; font: 700 12px/1 var(--font);
}
.km-icon.u span { background: var(--u); }
.km-icon.i span { background: var(--i); }
.zoom-lo .km-icon:not(.major) span { width: 10px; height: 10px; font-size: 0; }

/* Ulysse's spot: a "!" pin, and a card that folds into it when tapped */
.zc-pin {
  position: absolute; left: -17px; top: -41px; width: 34px; height: 34px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  background: var(--zone); border: 3px solid #fff;
  box-shadow: 0 2px 8px rgb(31 26 44 / 0.35);
  display: grid; place-items: center;
}
.zc-pin span { transform: rotate(45deg); font: 700 19px/1 var(--font); color: var(--zone-ink); }
.zc-card {
  position: absolute; left: 0; top: 24px; transform: translateX(-50%);
  width: 196px; padding: 9px 34px 10px 12px; border-radius: 12px;
  background: var(--zone); color: var(--zone-ink);
  font-size: 14px; line-height: 1.3;
  box-shadow: 0 2px 10px rgb(31 26 44 / 0.25);
}
.zc-card::before {
  content: ""; position: absolute; left: 50%; top: -8px; margin-left: -8px;
  border: 8px solid transparent; border-top: 0; border-bottom-color: var(--zone);
}
.zc-card strong { display: block; font-size: 16px; }
.zc-card .when { display: block; margin-top: 2px; font-weight: 700; }
.zc-min {
  position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: rgb(90 65 0 / 0.14); font-weight: 700;
}
.zone-callout.folded .zc-card { display: none; }
@media (max-width: 759px) { .zc-card { width: 166px; font-size: 13px; } .zc-card strong { font-size: 15px; } }
.leaflet-tooltip.place-tip {
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 3px 8px; font-size: 14px; font-weight: 700; box-shadow: 0 1px 4px rgb(0 0 0 / 0.18);
}
.zoom-lo .leaflet-tooltip.place-tip.station { display: none; }

.leaflet-popup-content-wrapper { border-radius: 14px; }
.leaflet-popup-content { margin: 12px 14px; font-size: 16px; line-height: 1.35; }
.pass-title { margin: 0 0 8px; font-weight: 700; }
.pass {
  display: flex; align-items: center; gap: 8px; width: 100%;
  margin: 0 0 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
  background: #faf9fb; text-align: left; cursor: pointer;
}
.pass:hover { background: #f1eff5; }
.pass .d { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.pass.u .d { background: var(--u); }
.pass.i .d { background: var(--i); }
.pass small { color: var(--muted); margin-left: auto; padding-left: 10px; font-size: 14px; white-space: nowrap; }
.pass > span:nth-child(2) { white-space: nowrap; }
.pass-note { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.leaflet-control-zoom a, .fit-btn { width: 40px !important; height: 40px !important; line-height: 40px !important; font-size: 22px !important; }
.fit-btn { display: grid !important; place-items: center; background: #fff; color: var(--ink); cursor: pointer; }
.fit-btn svg { width: 20px; height: 20px; }
.leaflet-control-attribution { font-size: 11px; }

/* ---------- layout: phone ---------- */
@media (max-width: 759px) {
  body { font-size: 17px; }
  .app {
    grid-template-columns: 1fr 78px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "head head" "stage scrub";
  }
  .panel {
    position: static;
    grid-area: head;
    width: auto;
    border-radius: 0;
    box-shadow: none;
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    gap: 6px;
  }
  .top { flex-direction: row; justify-content: space-between; align-items: center; gap: 12px; }
  .top .eyebrow { text-align: right; font-size: 12px; }
  .top .eyebrow span { display: block; }
  .top .eyebrow .sep { display: none; }
  .clock { font-size: 38px; margin: 0; }
  .tgl .lg { display: none; }
  .leaflet-bottom.leaflet-left { bottom: 28px; }
  .slot { height: 40px; }
  .toggles { top: 12px; right: 12px; }
  .tgl { min-height: 42px; font-size: 15px; padding: 0 14px 0 10px; }
  .scrubber {
    border-top: 0;
    border-left: 1px solid var(--line);
    padding: 22px 0 calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .evrow { display: none; }
  .rail { height: 100%; --gx: 52px; }
  .groove, .fill, .band { left: calc(var(--gx) - 4px); right: auto; top: 0; bottom: 0; width: 8px; height: auto; }
  .fill { bottom: auto; height: calc(var(--p) * 100%); }
  .band { left: calc(var(--gx) - 7px); width: 14px; top: calc(var(--a) * 100%); bottom: auto; height: calc((var(--b) - var(--a)) * 100%); min-height: 6px; min-width: 0; }
  .tick { left: calc(var(--gx) - 16px); top: calc(var(--p) * 100%); width: 6px; height: 2px; margin: -1px 0 0; }
  .tick.minor { width: 4px; left: calc(var(--gx) - 14px); height: 2px; }
  .tick span { top: 50%; left: auto; right: 10px; transform: translateY(-50%); font-size: 14px; }
  .ev { left: var(--gx); top: calc(var(--p) * 100%); margin: -7px 0 0 -7px; }
  .thumb { left: var(--gx); top: calc(var(--p) * 100%); width: 38px; height: 38px; margin: -19px 0 0 -19px; }
}
@media (max-width: 759px) and (max-height: 620px) {
  .tip { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="panel">
    <div class="top">
      <p class="clock" id="clock">10 h 07</p>
      <p class="eyebrow"><span>Horaire prévu</span><span class="sep"> · </span><span>dimanche 4 octobre</span></p>
    </div>
    <ul class="runners">
      <li class="runner u"><span class="dot"></span><span class="who">Ulysse<small>42,2 km</small></span><span class="st" id="st-u"></span></li>
      <li class="runner i"><span class="dot"></span><span class="who">Indiana<small>21,1 km</small></span><span class="st" id="st-i"></span></li>
    </ul>
    <div class="slot">
      <p class="hint" id="hint">Touchez le parcours pour voir à quelle heure ils y passent.</p>
      <p class="banner" id="banner" hidden>Ulysse passe entre la Plage et la Voile</p>
    </div>
    <p class="tip">Le jour même, suivez-les en direct dans l'app Sportstats.</p>
  </header>

  <main class="stage">
    <div id="map" aria-label="Carte du parcours"></div>
    <div class="toggles">
      <button class="tgl" id="tgl-velo" type="button" aria-pressed="false">
        <span class="box"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5l4-7h6l3 7M9.5 9.5l3 7h-7M15.5 9.5l-1.5-3h-2"/></svg>
        <span><span class="lg">Stations </span>àVélo</span>
      </button>
      <button class="tgl" id="tgl-km" type="button" aria-pressed="false">
        <span class="box"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span>
        <span>Bornes km</span>
      </button>
      <p class="velo-note" id="velo-note" hidden>Vélos interdits sur le parcours</p>
    </div>
  </main>

  <div class="scrubber" id="scrubber">
    <div class="evrow" id="row-u"></div>
    <div class="rail" id="rail" role="slider" tabindex="0" aria-label="Heure de la journée" aria-orientation="horizontal">
      <div class="groove"></div>
      <div class="fill"></div>
      <div class="band" id="band"></div>
      <div id="ticks"></div>
      <div id="evdots"></div>
      <div class="thumb"></div>
    </div>
    <div class="evrow" id="row-i"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha256-RamwepGJzlYFTGIKlHzPQeKR5YyV6bYVM7dAqqZe5cs=" crossorigin=""></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" integrity="sha256-Hmz4yz61/ZCYeaob82o4P7UGyaWy27+rq85lopTdH8s=" crossorigin=""></script>
<script>
// Course geometry: official 2026 course maps fitted to the GPX tracks.

  const I_CLOCK = [0, 359, 728, 1090, 1481, 1930, 2357, 2704, 3119, 3471, 3737, 4089, 4452, 4825, 5179, 5548, 5914, 6279, 6653, 7011, 7387, 7754];
  const I_TAB = I_CLOCK.map((s, k) => [k, s]).concat([[21.0975, 7790]]).map(([k, s]) =>
    [k, k <= 9 ? s : k <= 10 ? s + 39 * (k - 9) : s + 39 * (21.0975 - k) / 11.0975]);

  const RUNNERS = [
    { id: 'u', name: 'Ulysse', start: hms(8, 0), tab: U_TAB, track: DATA.marathon, kms: DATA.mkm,
      before: t => `part à ${fmt(t)}`, after: t => `arrivé vers ${fmt(t)}` },
    { id: 'i', name: 'Indiana', start: hms(10, 8), tab: I_TAB, track: DATA.half, kms: DATA.hkm,
      before: t => `part vers ${fmt(t)}`, after: t => `arrivée vers ${fmt(t)}` },
  ];
  for (const r of RUNNERS) {
    r.total = r.tab[r.tab.length - 1][0];
    r.finish = r.start + r.tab[r.tab.length - 1][1];
  }
  const [U, I] = RUNNERS;

  function fmt(sec) {
    const m = Math.round(sec / 60);
    return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
  }
  const fmtKm = km => km.toFixed(1).replace('.', ',');

  function interp(tab, x, from, to) {
    if (x <= tab[0][from]) return tab[0][to];
    for (let j = 1; j < tab.length; j++) {
      const a = tab[j - 1], b = tab[j];
      if (x <= b[from]) return a[to] + (b[to] - a[to]) * (x - a[from]) / (b[from] - a[from] || 1);
    }
    return tab[tab.length - 1][to];
  }
  const kmAt = (r, t) => interp(r.tab, t - r.start, 1, 0);
  const timeAtKm = (r, km) => r.start + interp(r.tab, km, 0, 1);

  function pointAtKm(track, km) {
    let lo = 0, hi = track.length - 1;
    if (km <= track[0][2]) return [track[0][0], track[0][1]];
    if (km >= track[hi][2]) return [track[hi][0], track[hi][1]];
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (track[mid][2] <= km) lo = mid; else hi = mid; }
    const a = track[lo], b = track[hi], f = (km - a[2]) / (b[2] - a[2] || 1);
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }
  function slice(track, k0, k1) {
    const pts = [pointAtKm(track, k0)];
    for (const p of track) if (p[2] > k0 && p[2] < k1) pts.push([p[0], p[1]]);
    pts.push(pointAtKm(track, k1));
    return pts;
  }

  const ZONE_IN = timeAtKm(U, DATA.zone.from), ZONE_OUT = timeAtKm(U, DATA.zone.to);
  const floorMin = s => Math.floor(s / 60) * 60, ceilMin = s => Math.ceil(s / 60) * 60;
  const ZONE_TEXT = `vers ${fmt(floorMin(ZONE_IN))} à ${fmt(ceilMin(ZONE_OUT))}`;

  // ---------- map ----------
  const map = L.map('map', { zoomControl: false, zoomSnap: 0.25 });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  map.attributionControl.addAttribution('àVélo (RTC)');

  // Base map: OpenFreeMap's positron style, recoloured to white roads, black labels,
  // light-green parks and blue water, without route-number shields.
  // Plain OpenStreetMap tiles, muted, if WebGL or the style is unavailable.
  const ATTR_OSM = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  function rasterBase() {
    map.getContainer().classList.add('raster-muted');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: ATTR_OSM }).addTo(map);
  }
  function restyle(style) {
    style.layers = style.layers.filter(l => !/shield|airport/.test(l.id));
    const set = (id, prop, value) => {
      const layer = style.layers.find(l => l.id === id);
      if (layer) (layer.paint = layer.paint || {})[prop] = value;
    };
    set('background', 'background-color', '#ffffff');
    set('landuse_residential', 'fill-color', '#ffffff');
    set('park', 'fill-color', '#d8eeca');
    set('landcover_wood', 'fill-color', '#cde6bb');
    set('water', 'fill-color', '#a9d4f2');
    set('waterway', 'line-color', '#a9d4f2');
    set('building', 'fill-color', '#f2f2f0');
    set('building', 'fill-outline-color', '#e2e2df');
    for (const id of ['highway-name-major', 'highway-name-minor', 'highway-name-path', 'label_other']) set(id, 'text-color', '#262626');
    for (const id of ['water_name_point_label', 'water_name_line_label']) set(id, 'text-color', '#23679a');
    return style;
  }
  function hasWebGL() {
    try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
  }
  if (typeof L.maplibreGL === 'function' && hasWebGL()) {
    fetch('https://tiles.openfreemap.org/styles/positron')
      .then(r => { if (!r.ok) throw new Error(`style ${r.status}`); return r.json(); })
      .then(style => L.maplibreGL({ style: restyle(style) }).addTo(map))
      .catch(rasterBase);
  } else {
    rasterBase();
  }
  // Runners stay above every label on the map.
  map.createPane('runners').style.zIndex = 660;
  L.control.zoom({ position: 'bottomleft', zoomInTitle: 'Zoomer', zoomOutTitle: 'Dézoomer' }).addTo(map);

  const ll = t => t.map(p => [p[0], p[1]]);
  const esc = str => str.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const zoneLine = slice(U.track, DATA.zone.from, DATA.zone.to);
  L.polyline(zoneLine, { color: '#ffc62b', weight: 20, opacity: 0.9, lineCap: 'round', interactive: false }).addTo(map);
  // Purple only where Ulysse runs alone; where both courses share the road, only orange shows.
  L.polyline(DATA.mdraw, { color: '#5b2d97', weight: 6, opacity: 0.92, interactive: false }).addTo(map);
  L.polyline(ll(I.track), { color: '#e05a12', weight: 5, opacity: 1, interactive: false }).addTo(map);

  const fullBounds = L.latLngBounds(ll(U.track).concat(ll(I.track)));
  if ('ResizeObserver' in window) new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(map.getContainer());
  const isPhone = () => matchMedia('(max-width: 759px)').matches;
  function fitAll() {
    map.fitBounds(fullBounds, isPhone()
      ? { padding: [16, 16] }
      : { paddingTopLeft: [372, 24], paddingBottomRight: [24, 24] });
  }

  const Fit = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd() {
      const bar = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'fit-btn', bar);
      a.href = '#';
      a.title = 'Voir tout le parcours';
      a.setAttribute('role', 'button');
      a.setAttribute('aria-label', 'Voir tout le parcours');
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
      L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); L.DomEvent.stopPropagation(e); fitAll(); });
      L.DomEvent.disableClickPropagation(bar);
      return bar;
    },
  });
  new Fit().addTo(map);

  // start / finish
  const fin = U.track[U.track.length - 1];
  L.circleMarker([fin[0], fin[1]], { radius: 7, color: '#1f1a2c', weight: 3, fillColor: '#fff', fillOpacity: 1, interactive: false })
    .bindTooltip('Départ et arrivée', { permanent: true, direction: 'top', offset: [0, -14], className: 'place-tip' })
    .addTo(map);

  // the spot Ulysse asked for: a "!" pin whose card folds away when tapped
  const mid = pointAtKm(U.track, (DATA.zone.from + DATA.zone.to) / 2);
  let folded = store.get('zone-folded') === '1';
  const callout = L.marker(mid, {
    zIndexOffset: 500,
    icon: L.divIcon({
      className: `zone-callout${folded ? ' folded' : ''}`, iconSize: [0, 0], iconAnchor: [0, 0],
      html: '<span class="zc-pin" aria-hidden="true"><span>!</span></span>' +
        `<span class="zc-card"><strong>Ulysse aimerait te voir ici</strong>entre la Plage et la Voile<span class="when">${ZONE_TEXT}</span><span class="zc-min" aria-hidden="true">–</span></span>`,
    }),
  }).addTo(map);
  callout.on('click', () => {
    folded = !folded;
    callout.getElement().classList.toggle('folded', folded);
    store.set('zone-folded', folded ? '1' : '0');
  });
  for (const [name, p, dir] of [['Station de la Plage', DATA.plage, 'left'], ['Station de la Voile', DATA.voile, 'left']]) {
    L.circleMarker(p, { radius: 6, color: '#5a4100', weight: 2, fillColor: '#ffc62b', fillOpacity: 1, interactive: false })
      .bindTooltip(name, { permanent: true, direction: dir, offset: [-8, 0], className: 'place-tip station' })
      .addTo(map);
  }

  // layers behind the toggles
  const veloLayer = L.layerGroup(DATA.avelo.map(([name, lat, lon]) =>
    L.circleMarker([lat, lon], { radius: 6, color: '#fff', weight: 2, fillColor: '#0d7a64', fillOpacity: 1, bubblingMouseEvents: false })
      .bindPopup(`<strong>${esc(name)}</strong><br>Station àVélo`)));
  const kmLayer = L.layerGroup();
  for (const r of RUNNERS) {
    for (const [k, lat, lon] of r.kms) {
      const dx = r.id === 'u' ? 24 : 0; // marathon numbers sit left of the line, half-marathon numbers right
      kmLayer.addLayer(L.marker([lat, lon], {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: `km-icon ${r.id}${k % 5 ? '' : ' major'}`, html: `<span>${k}</span>`, iconSize: [24, 24], iconAnchor: [dx, 12] }),
      }));
    }
  }
  function zoomClass() { map.getContainer().classList.toggle('zoom-lo', map.getZoom() < 13.5); }
  map.on('zoomend', zoomClass);

  // runner markers
  for (const r of RUNNERS) {
    r.marker = L.marker([r.track[0][0], r.track[0][1]], {
      interactive: false, keyboard: false, pane: 'runners', zIndexOffset: r.id === 'u' ? 1000 : 900,
      icon: L.divIcon({ className: `runner-icon ${r.id}`, html: `<span class="rdot"></span><span class="rlabel">${r.name}</span>`, iconSize: [0, 0], iconAnchor: [0, 0] }),
    }).addTo(map);
  }

  // ---------- toggles ----------
  function bindToggle(id, layer, onChange) {
    const btn = document.getElementById(id);
    const apply = on => {
      btn.setAttribute('aria-pressed', String(on));
      if (on) layer.addTo(map); else layer.remove();
      if (onChange) onChange(on);
    };
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') !== 'true';
      apply(on);
      store.set(id, on ? '1' : '0');
    });
    apply(store.get(id) === '1');
  }
  bindToggle('tgl-velo', veloLayer, on => { document.getElementById('velo-note').hidden = !on; });
  bindToggle('tgl-km', kmLayer);

  // ---------- time ----------
  const rail = document.getElementById('rail');
  const scrubber = document.getElementById('scrubber');
  const clockEl = document.getElementById('clock');
  const hint = document.getElementById('hint'), banner = document.getElementById('banner');
  const stEl = { u: document.getElementById('st-u'), i: document.getElementById('st-i') };
  const frac = t => (t - T0) / (T1 - T0);
  let now = hms(10, 7);

  function statusOf(r, t) {
    if (t <= r.start) return r.before(r.start);
    if (t >= r.finish) return r.after(r.finish);
    return `km ${fmtKm(kmAt(r, t))}`;
  }
  function setTime(t) {
    now = Math.min(T1, Math.max(T0, Math.round(t / 60) * 60));
    scrubber.style.setProperty('--p', frac(now));
    clockEl.textContent = fmt(now);
    const parts = [];
    for (const r of RUNNERS) {
      r.marker.setLatLng(pointAtKm(r.track, kmAt(r, now)));
      const s = statusOf(r, now);
      stEl[r.id].textContent = s;
      parts.push(`${r.name} ${s}`);
    }
    const inZone = now >= floorMin(ZONE_IN) && now <= ceilMin(ZONE_OUT);
    banner.hidden = !inZone;
    hint.hidden = inZone;
    rail.setAttribute('aria-valuenow', String(now));
    rail.setAttribute('aria-valuetext', `${fmt(now)} : ${parts.join(', ')}`);
  }

  // scrubber decorations
  rail.setAttribute('aria-valuemin', String(T0));
  rail.setAttribute('aria-valuemax', String(T1));
  const band = document.getElementById('band');
  band.style.setProperty('--a', frac(floorMin(ZONE_IN)));
  band.style.setProperty('--b', frac(ceilMin(ZONE_OUT)));
  const ticks = document.getElementById('ticks');
  for (let t = hms(8, 0); t <= T1; t += 1800) {
    const el = document.createElement('div');
    const major = t % 3600 === 0;
    el.className = 'tick' + (major ? '' : ' minor');
    el.style.setProperty('--p', frac(t));
    if (major) el.innerHTML = `<span>${t / 3600} h</span>`;
    ticks.appendChild(el);
  }
  const EVENTS = [
    { r: 'u', t: U.start, go: U.start, text: 'Départ', name: " d'Ulysse", when: fmt(U.start) },
    { r: 'u', t: ZONE_IN, go: (ZONE_IN + ZONE_OUT) / 2, text: 'Plage', name: '–Voile', when: fmt(floorMin(ZONE_IN)), zone: true },
    { r: 'u', t: U.finish, go: U.finish, text: 'Arrivée', name: " d'Ulysse", when: fmt(U.finish) },
    { r: 'i', t: I.start, go: I.start, text: 'Départ', name: " d'Indiana", when: fmt(I.start) },
    { r: 'i', t: I.finish, go: I.finish, text: 'Arrivée', name: " d'Indiana", when: fmt(I.finish), end: true },
  ];
  const evdots = document.getElementById('evdots');
  for (const ev of EVENTS) {
    const dot = document.createElement('span');
    dot.className = `ev ${ev.r}`;
    dot.style.setProperty('--p', frac(ev.t));
    if (!ev.zone) evdots.appendChild(dot);
    const lab = document.createElement('button');
    lab.type = 'button';
    lab.className = `evl ${ev.r}${ev.zone ? ' zone' : ''}${ev.end ? ' end' : ''}`;
    lab.style.setProperty('--p', frac(ev.t));
    lab.innerHTML = `<span class="d"></span><span>${ev.text}<span class="nm">${ev.name}</span> · <b>${ev.when}</b></span>`;
    lab.dataset.go = ev.go;
    document.getElementById(`row-${ev.r}`).appendChild(lab);
  }

  // dragging
  let dragging = false;
  function fromPointer(e) {
    const r = rail.getBoundingClientRect();
    const f = isPhone() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    setTime(T0 + Math.min(1, Math.max(0, f)) * (T1 - T0));
  }
  scrubber.addEventListener('pointerdown', e => {
    const go = e.target.closest('[data-go]');
    if (go) { setTime(+go.dataset.go); return; }
    dragging = true;
    scrubber.setPointerCapture(e.pointerId);
    fromPointer(e);
  });
  scrubber.addEventListener('pointermove', e => { if (dragging) fromPointer(e); });
  const stop = () => { dragging = false; };
  scrubber.addEventListener('pointerup', stop);
  scrubber.addEventListener('pointercancel', stop);
  rail.addEventListener('keydown', e => {
    // Time runs left to right on a laptop and top to bottom on a phone.
    const up = isPhone() ? -60 : 60;
    const step = { ArrowRight: 60, ArrowLeft: -60, ArrowUp: up, ArrowDown: -up, PageDown: 900, PageUp: -900, Home: T0 - now, End: T1 - now }[e.key];
    if (step === undefined) return;
    setTime(now + step);
    e.preventDefault();
  });
  function orient() { rail.setAttribute('aria-orientation', isPhone() ? 'vertical' : 'horizontal'); }
  matchMedia('(max-width: 759px)').addEventListener('change', () => { orient(); map.invalidateSize(); fitAll(); });

  // ---------- tap the course: when do they pass here? ----------
  function passesNear(r, pt, maxPx) {
    const hits = [];
    const P = r.track.map(p => map.latLngToContainerPoint([p[0], p[1]]));
    for (let j = 1; j < P.length; j++) {
      const a = P[j - 1], b = P[j];
      const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
      const f = L2 ? Math.max(0, Math.min(1, ((pt.x - a.x) * dx + (pt.y - a.y) * dy) / L2)) : 0;
      const d = Math.hypot(pt.x - (a.x + f * dx), pt.y - (a.y + f * dy));
      if (d <= maxPx) hits.push({ d, km: r.track[j - 1][2] + f * (r.track[j][2] - r.track[j - 1][2]) });
    }
    hits.sort((x, y) => x.km - y.km);
    const groups = [];
    for (const h of hits) {
      const g = groups[groups.length - 1];
      if (g && h.km - g.last < 0.4) { g.last = h.km; if (h.d < g.best.d) g.best = h; }
      else groups.push({ last: h.km, best: h });
    }
    return groups.map(g => g.best.km);
  }
  map.on('click', e => {
    const pt = map.latLngToContainerPoint(e.latlng);
    const rows = [];
    for (const r of RUNNERS) for (const km of passesNear(r, pt, 24)) rows.push({ r, km, t: timeAtKm(r, km) });
    if (!rows.length) return;
    rows.sort((a, b) => a.t - b.t);
    const html = `<p class="pass-title">Heure de passage ici</p>` +
      rows.map(x => `<button type="button" class="pass ${x.r.id}" data-t="${Math.round(x.t)}"><span class="d"></span><span><b>${x.r.name}</b> vers ${fmt(x.t)}</span><small>km ${fmtKm(x.km)}</small></button>`).join('') +
      `<p class="pass-note">Touchez une heure pour la voir sur la carte.</p>`;
    L.popup({ maxWidth: 320, minWidth: 250 }).setLatLng(e.latlng).setContent(html).openOn(map);
  });
  map.on('popupopen', e => {
    e.popup.getElement().addEventListener('click', ev => {
      const b = ev.target.closest('.pass');
      if (b) { setTime(+b.dataset.t); map.closePopup(); }
    });
  });

  // ---------- start ----------
  orient();
  fitAll();
  zoomClass();
  let start = hms(10, 7);
  try {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    const g = type => parts.find(p => p.type === type).value;
    const sec = hms(+g('hour'), +g('minute'));
    if (`${g('year')}-${g('month')}-${g('day')}` === '2026-10-04' && sec >= T0 && sec <= T1) start = sec;
  } catch { /* keep the default */ }
  setTime(start);
})();
</script>
</body>
</html>
